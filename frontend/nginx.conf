server {
  listen 8888;
  root /usr/share/nginx/html;

  # `api.ts` talks to the same origin it was served from, so /api has to reach the backend
  # from here. This replaces the proxy that lived in `hooks.server.ts`. Interim, like the
  # rest of this file: once the backend serves the build itself there is no hop to make.
  #
  # Origin is passed through untouched. Better Auth checks it against its trusted origins,
  # and rewriting it to the backend's host fails that check on every sign-in.
  location /api/ {
    proxy_pass http://backend:8887;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # File uploads: CSV statements go through this.
    client_max_body_size 32m;
    proxy_request_buffering off;
  }

  # Hashed filenames, so they can be cached hard. Anything under _app/immutable is
  # rebuilt under a new name when it changes.
  location /_app/immutable/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: the client router owns every path, so an unknown one is not a 404 —
  # it is a route the browser has not resolved yet. Serve the document and let it.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
