<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design bench</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 8px;
      }
      label {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #note {
        margin: 0;
      }
      #lab {
        max-height: 40vh;
        overflow: auto;
        padding: 0 8px;
      }
      #lab-body {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
        padding-bottom: 8px;
      }
      #lab-body textarea {
        font-family: ui-monospace, monospace;
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 8px;
        padding: 8px;
        overflow: auto;
      }
      iframe {
        border: 1px solid GrayText;
        background: Canvas;
      }
    </style>
  </head>
  <body>
    <header id="controls"></header>
    <details id="lab"><summary>Theme lab</summary><div id="lab-body"></div></details>
    <main id="frames"></main>
    <script type="module" src="./bench.ts"></script>
  </body>
</html>
