services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Still called `backend` though it now serves the frontend too: it is the same process
  # and the same image, and renaming it would break every `compose logs backend` and
  # `have-fish-backend-1` in anyone's history for a cosmetic gain.
  backend:
    image: ghcr.io/lesterhan/have-fish-backend:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "8887"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # Still read: Better Auth checks it as a trusted origin, and the mobile app is a
      # separate origin whichever way the web app is served.
      FRONTEND_URL: ${FRONTEND_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    # Published on 8888, the port the app has always answered on, so bookmarks and
    # Tailscale keep working. Inside the container it still listens on 8887.
    ports:
      - "8888:8887"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "bun run db:migrate && bun run src/index.ts"

volumes:
  postgres_data:
