# The desktop app as a Flatpak (#518): the release binary, unchanged, on the freedesktop
# runtime, with the menu entry, icon and metainfo around it. Nothing is compiled here; the
# binary is `bun run build:binary`'s, staged at build/havefish first (README.md says how).
id: com.lesterhan.havefish
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
branch: stable
command: havefish
finish-args:
  # The one permission. The app listens on 127.0.0.1 and the browser outside has to reach it;
  # the opt-in FX lookup is the only call it makes outward. No files beyond its own data
  # directory, no display, no devices: it has no window, and opens the browser through the
  # portal.
  - --share=network
build-options:
  # `bun build --compile` keeps the app after the end of the executable, where strip would cut
  # it off; and there is no debug info in it to split out.
  strip: false
  no-debuginfo: true
modules:
  - name: havefish
    buildsystem: simple
    build-commands:
      - install -Dm755 havefish /app/bin/havefish
      - install -Dm644 com.lesterhan.havefish.desktop -t /app/share/applications
      - install -Dm644 favicon.svg /app/share/icons/hicolor/scalable/apps/com.lesterhan.havefish.svg
      - install -Dm644 com.lesterhan.havefish.metainfo.xml -t /app/share/metainfo
      # The release the binary says it is, dated the day it was packaged, so software centres
      # show which version is installed without anyone editing the metainfo for each tag.
      - >-
        sed -i
        -e "s/@VERSION@/$(/app/bin/havefish --version | cut -d' ' -f2)/"
        -e "s/@DATE@/$(date -u +%F)/"
        /app/share/metainfo/com.lesterhan.havefish.metainfo.xml
    sources:
      - type: file
        path: build/havefish
      - type: file
        path: com.lesterhan.havefish.desktop
      - type: file
        path: com.lesterhan.havefish.metainfo.xml
      # The same icon the binary puts in the menu itself (desktop-entry.ts).
      - type: file
        path: ../frontend/static/favicon.svg
