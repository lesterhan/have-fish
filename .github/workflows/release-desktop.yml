name: Release desktop
# A v* tag (#493) builds the local edition as one file per target, starts each one on its own
# architecture, and publishes them with SHA256SUMS as a GitHub Release (#335). The APK's tags
# are android-v*, which build-android.yml handles; the pattern below matches neither those nor
# a mistyped tag such as v.1.1.7.
#
# The same binaries go into a Flatpak (#518), which is built and started in its sandbox, and a
# tag also publishes them as a signed Flatpak repo on GitHub Pages; flatpak/README.md has the
# rest.
#
# A manual run, or a pull request that touches flatpak/ or this file, builds and tests without
# publishing; the binaries and bundles stay as workflow artifacts.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    paths:
      - "flatpak/**"
      - ".github/workflows/release-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          # One runner per architecture: libsql's native addon is installed only for the
          # machine `bun install` runs on, and each binary is started where it will run.
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      # PUBLIC_VERSION stamps both halves: the frontend's status bar and `havefish --version`.
      - name: Build the binary
        working-directory: backend
        env:
          PUBLIC_VERSION: ${{ steps.version.outputs.version }}
        run: bun run build:binary --target ${{ matrix.target }} --outfile dist/havefish-${{ matrix.target }}

      - name: Start it, twice
        working-directory: backend
        env:
          HAVEFISH_BINARY: dist/havefish-${{ matrix.target }}
          HAVEFISH_BINARY_VERSION: ${{ steps.version.outputs.version }}
        run: NODE_ENV=test bun test src/local/binary.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: havefish-${{ matrix.target }}
          path: backend/dist/havefish-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: build
    strategy:
      matrix:
        include:
          - target: linux-x64
            arch: x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: havefish-${{ matrix.target }}
          path: flatpak/build

      # The manifest takes the binary from flatpak/build/havefish; an artifact loses its mode.
      - name: Stage the binary
        run: |
          mv flatpak/build/havefish-${{ matrix.target }} flatpak/build/havefish
          chmod +x flatpak/build/havefish

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dbus-daemon
          # Ubuntu 24.04 keeps unprivileged processes from making user namespaces, which bwrap
          # needs for every build step and every run.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build
        run: >-
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse
          --force-clean --repo=repo build-dir flatpak/com.lesterhan.havefish.yml

      - name: Bundle
        run: >-
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          repo havefish-${{ matrix.arch }}.flatpak com.lesterhan.havefish stable

      # Installed from the bundle and started the way the menu starts it. The runner has a
      # system bus but no session bus, which `flatpak run` wants for the portals.
      - name: Install it and start it
        run: |
          flatpak install --user --noninteractive --bundle havefish-${{ matrix.arch }}.flatpak
          dbus-run-session -- flatpak/smoke.sh "${{ needs.build.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: havefish-flatpak-${{ matrix.arch }}
          path: havefish-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: havefish-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum havefish-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          The local edition of have-fish for Linux: one file, no install, and your ledger stays on
          your machine. It opens your browser signed in, and keeps its data in
          \`~/.local/share/havefish\`. Before it updates the ledger's format it copies the file into
          \`backups/\` there. The first run adds it to your applications menu, and the ✕ in its
          title bar quits it.

          | File | For |
          |---|---|
          | \`havefish-linux-x64\` | 64-bit Intel or AMD, glibc |
          | \`havefish-linux-arm64\` | 64-bit ARM, glibc |

          \`\`\`sh
          curl -LO https://github.com/$REPO/releases/download/$TAG/havefish-linux-x64
          curl -LO https://github.com/$REPO/releases/download/$TAG/SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          chmod +x havefish-linux-x64
          ./havefish-linux-x64
          \`\`\`

          Or install it as a Flatpak, which keeps its data in \`~/.var/app/com.lesterhan.havefish\`
          and updates with your other Flatpaks:

          \`\`\`sh
          flatpak install --user https://${REPO%%/*}.github.io/${REPO#*/}/havefish.flatpakref
          \`\`\`
          EOF

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: have-fish ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          # v0.2.0-rc.1 and the like are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/havefish-linux-x64
            dist/havefish-linux-arm64
            dist/SHA256SUMS

  pages:
    name: Publish the Flatpak repo
    needs: flatpak
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deployment at a time: two tags pushed together publish in turn.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: havefish-flatpak-*
          merge-multiple: true
          path: bundles

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      # The key from have-fish-ops/process/credentials.md. The fingerprint is public and pinned
      # here, so a secret replaced by the wrong key fails the release instead of signing it.
      - name: Import the signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "::error::the FLATPAK_GPG_PRIVATE_KEY secret is not set"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build the repo
        run: >-
          flatpak/publish.sh site "${{ steps.pages.outputs.base_url }}"
          1C9FC3BBD1CC51727C93015E357DB4E7B71F625A bundles/*.flatpak

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
