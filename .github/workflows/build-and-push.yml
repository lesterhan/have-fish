name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        run: echo "VERSION=$(date -u '+%Y-%m-%d').${GITHUB_SHA::8}.$(date -u '+%H%M')" >> $GITHUB_ENV

      # One image now: the backend serves the frontend's build, so the context is the
      # repository root and a single Dockerfile assembles both halves. The
      # have-fish-frontend image is no longer produced; nothing pulls it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lesterhan/have-fish-backend:latest
          build-args: PUBLIC_VERSION=${{ env.VERSION }}

