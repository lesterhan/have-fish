name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # One formatter and one linter for every half of the repo, configured in `biome.jsonc`
  # at the root. This job is deliberately the cheapest in the file — no database, no
  # install beyond one binary — so a formatting or lint break is reported in seconds
  # rather than behind a four-minute test run.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Biome
        run: bun install

      # `check` is formatter + linter + import sorting in one pass. Warnings do not fail
      # the job; errors do.
      - name: Format and lint
        run: bun run check

  backend:
    # Pinned rather than `latest` because hledger comes from this image's apt: 24.04 ships
    # 1.30.1, the version the export's acceptance test was written against. A new image is
    # a new hledger, and that should be a commit, not a surprise.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: havefish
          POSTGRES_PASSWORD: havefish
          POSTGRES_DB: havefish
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://havefish:havefish@localhost:5432/havefish
      TEST_DATABASE_URL: postgres://havefish:havefish@localhost:5432/havefish_test
      BETTER_AUTH_SECRET: ci-secret-not-used-in-tests
      BETTER_AUTH_URL: http://localhost:8887
      # The hledger acceptance test skips itself where there is no hledger; here there must
      # be one, so a missing binary fails the job instead of passing it quietly.
      REQUIRE_HLEDGER: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The journal export's acceptance test (#283, src/export/hledger.test.ts) hands the
      # export to a real hledger and checks it reports the app's balances to the cent.
      - name: Install hledger
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q hledger
          hledger --version

      - name: Create test database
        run: psql postgres://havefish:havefish@localhost:5432/havefish -c 'CREATE DATABASE havefish_test;'

      - name: Install backend dependencies
        working-directory: backend
        run: bun install

      - name: Run migrations
        working-directory: backend
        run: bun run db:migrate:test

      - name: Run tests
        working-directory: backend
        run: bun test

      # A transaction's date must not depend on the machine's time zone (#277). The runner
      # is in UTC, where a date bug hides, so the date-bearing suites run again east and
      # west of it.
      - name: Run date tests in other time zones
        working-directory: backend
        run: bun run test:zones

      # `bun test` strips types rather than checking them, so nothing in this job would
      # notice a type error until the dev server crashed. It matters for `src/errors.ts`,
      # whose whole point is that `fail(c, code, detail)` types the detail per code.
      - name: Type check
        working-directory: backend
        run: bun run check

  # The same suite on the local build's database (D8, #482): SQLite through libsql, in a temp
  # file the preload creates and migrates. No service container, and the three tests of
  # Postgres migrations skip themselves. The type check above already covers this build;
  # `bun run check` runs tsc once per dialect.
  backend-sqlite:
    runs-on: ubuntu-24.04

    env:
      BETTER_AUTH_SECRET: ci-secret-not-used-in-tests
      BETTER_AUTH_URL: http://localhost:8887
      # The journal export is the escape hatch, so it is held to hledger on this build too.
      REQUIRE_HLEDGER: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install hledger
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q hledger
          hledger --version

      - name: Install backend dependencies
        working-directory: backend
        run: bun install

      - name: Run tests on SQLite
        working-directory: backend
        run: bun run test:sqlite

  frontend:
    runs-on: ubuntu-latest

    # The frontend scripts default PUBLIC_VERSION to "dev", so nothing here requires it.
    # Setting the real SHA keeps this job stamping the same value the image build does,
    # and means a build step added here would produce a correctly stamped bundle.
    env:
      PUBLIC_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      # `bun run test`, not `bun test`: the script runs `svelte-kit sync` first, which
      # generates the `$lib` path mapping. A checkout does not carry it, and the route
      # guards under test import through that alias.
      - name: Run tests
        working-directory: frontend
        run: bun run test

      - name: Type check
        working-directory: frontend
        run: bun run check

      # The frontend is no longer built by its own image, so a build break would otherwise
      # reach `main` and only surface when the combined image is assembled.
      - name: Build
        working-directory: frontend
        run: bun run build
